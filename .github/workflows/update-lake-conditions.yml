name: Update Lake Conditions

on:
  workflow_dispatch:

  schedule:
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Update lake conditions
        run: |
          python scripts/update_lake_conditions.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add lake_conditions.json

          git diff --staged --quiet || git commit -m "Update lake conditions"

          git push
