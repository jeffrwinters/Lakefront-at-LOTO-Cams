name: Update Lake Conditions

on:
  workflow_dispatch:

  pull_request:
    paths:
      - 'scripts/update_lake_conditions.py'
      - '.github/workflows/update-lake-conditions.yml'

  schedule:
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update lake conditions
        run: python scripts/update_lake_conditions.py

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add lake_conditions.json

          git diff --staged --quiet || git commit -m "Update lake conditions"

          git push
