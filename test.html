const map = L.map('lakeMap', {
  zoomControl: false,
  attributionControl: false
}).setView([38.19, -92.72], 11);

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {
    subdomains: 'abcd',
    maxZoom: 20
  }
).addTo(map);

L.control.zoom({
  position: 'bottomright'
}).addTo(map);

const restaurantLayer = L.layerGroup().addTo(map);
const marinaLayer = L.layerGroup().addTo(map);
const markerLayer = L.layerGroup().addTo(map);

async function loadLayer(url, layer, color, radius=7) {
  const response = await fetch(url);
  const data = await response.json();

  data.forEach(item => {
    const marker = L.circleMarker(
      [item.lat, item.lng],
      {
        radius,
        color,
        fillColor: color,
        fillOpacity: 0.9,
        weight: 2
      }
    );

    marker.bindPopup(`
      <div>
        <h3>${item.name}</h3>
        <p>${item.description || ''}</p>
      </div>
    `);

    marker.addTo(layer);
  });
}

async function loadMileMarkers() {
  const response = Promise.resolve({ json: async () => MILEMARKERS });
  const data = await response.json();

  data.forEach(item => {
    const label = L.marker(
      [item.lat, item.lng],
      {
        icon: L.divIcon({
          className: '',
          html: `<div style="
            color: rgba(255,255,255,0.75);
            font-size: 11px;
            font-weight: 700;
          ">${item.name}</div>`
        })
      }
    );

    label.addTo(markerLayer);
  });
}

loadLayer('./assets/maps/restaurants.json', restaurantLayer, '#ff884d');
loadLayer('./assets/maps/marinas.json', marinaLayer, '#4da3ff');
loadMileMarkers();

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {

    document.querySelectorAll('.filter-btn')
      .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    const layer = btn.dataset.layer;

    restaurantLayer.remove();
    marinaLayer.remove();
    markerLayer.remove();

    if (layer === 'all') {
      restaurantLayer.addTo(map);
      marinaLayer.addTo(map);
      markerLayer.addTo(map);
    }

    if (layer === 'food') {
      restaurantLayer.addTo(map);
    }

    if (layer === 'fuel') {
      marinaLayer.addTo(map);
    }

    if (layer === 'markers') {
      markerLayer.addTo(map);
    }
  });
});
