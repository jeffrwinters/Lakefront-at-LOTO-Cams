<!DOCTYPE html>

<html lang="en">
<head>
<meta content="https://cams.lakefrontatloto.com/" property="og:url"/>
<link href="https://cams.lakefrontatloto.com/" rel="canonical"/>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lakefront at LOTO Cams</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<style>
  :root {
    --bg: #02050a;
    --surface: #0d1430;
    --card: #14204a;
    --border: #2f47a1;

    --accent: #3157ff;
    --accent2: #8ea2ff;

    --text: #f4f7ff;
    --muted: #b3c0ff;
    --live: #ff4d4d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0,100,180,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 80%, rgba(0,196,255,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  
  header.app-header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid rgba(0, 140, 255, 0.18);
    background:
      linear-gradient(
        180deg,
        #021233 0%,
        #000814 100%
      );
    backdrop-filter: blur(12px);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 18px;
    min-width: 0;
  }

  .header-logo {
    width: 210px;
    max-width: 32vw;
    height: auto;
    object-fit: contain;
    flex-shrink: 0;
    filter:
      drop-shadow(0 0 10px rgba(0, 170, 255, 0.18))
      drop-shadow(0 0 18px rgba(0, 120, 255, 0.12));
  }

  .header-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .header-title {
    margin: 0;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 1px;
    color: #3f63ff;
    -webkit-text-stroke: 0.35px rgba(255,255,255,0.75);
    text-shadow:
      0 0 10px rgba(0,196,255,0.15),
      0 0 2px rgba(255,255,255,0.12);
    font-family: 'Bebas Neue', sans-serif;
  }

  .header-subtitle {
    margin-top: 6px;
    color: #6da8ff;
    font-size: 1rem;
    letter-spacing: 1px;
  }

  .header-controls { display: flex; align-items: center; gap: 12px; }

  @media (max-width: 768px) {
    header.app-header {
      padding: 14px 16px;
    }

    .header-logo {
      width: 140px;
    }

    .header-title {
      font-size: 1.3rem;
    }

    .header-subtitle {
      font-size: 0.9rem;
    }
  }


  #castBtn {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
    font-size: 15px;
    font-weight: 700;
    min-height: 44px;
  }

  #castBtn svg {
    flex-shrink: 0;
  }
  #castBtn:hover { border-color: #3f63ff; color: #3f63ff; }
  #castBtn.casting { border-color: #3f63ff; color: #3f63ff; background: rgba(0,196,255,0.1); }

  main {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  .player-section {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    margin-bottom: 24px;
  }

  @media (max-width: 900px) {
    .player-section {
      grid-template-columns: 1fr;
    }

    .sidebar {
      display: flex;
      margin-top: 12px;
      max-height: 260px;
      overflow: hidden;
      background: rgba(13,20,48,0.92);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

  
  .cam-search-wrap {
    padding: 6px 4px 10px;
  }

  .cam-search {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    outline: none;
    transition: all 0.18s ease;
  }

  .cam-search:focus {
    border-color: #3f63ff;
    box-shadow: 0 0 0 2px rgba(63,99,255,0.15);
  }

  .cam-search::placeholder {
    color: var(--muted);
  }


  .cam-list {
      max-height: 220px;
      width: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
  }

  .player-wrap {
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  .player-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(13,20,48,0.92);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }

  .cam-label { display: flex; align-items: center; gap: 10px; min-width: 0; }

  .live-dot {
    width: 8px; height: 8px; flex-shrink: 0;
    background: var(--live);
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .cam-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 1px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cam-index { font-size: 11px; color: var(--muted); font-weight: 300; flex-shrink: 0; }

  .player-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: #3f63ff; color: #3f63ff; }
  .btn.active { background: rgba(0,196,255,0.15); border-color: #3f63ff; color: #3f63ff; }
  .btn.accent { background: var(--accent); color: #000; border-color: #3f63ff; font-weight: 700; }
  .btn.accent:hover { background: #00e0ff; }
  .btn.danger { background: rgba(255,59,59,0.15); border-color: rgba(255,59,59,0.5); color: #ff6b6b; }

  .player-frame {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
  }

  #twitchFrame {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border: none;
  }

  .player-footer {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(13,20,48,0.92);
    border-top: 1px solid var(--border);
    gap: 10px;
  }

  .nav-controls { display: flex; gap: 8px; align-items: center; }

  .nav-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: #3f63ff; color: #3f63ff; }

  .timer-bar-wrap {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  #timerBar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    border-radius: 2px;
  }

  .auto-cycle-label { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ── Sidebar ── */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: rgba(13,20,48,0.7);
    border-radius: 14px;
    padding: 10px;
    border: 1px solid var(--border);
  }

  .sidebar-header {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--muted);
    padding: 0 4px 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }


  .cam-search-wrap {
    padding: 6px 4px 10px;
  }

  .cam-search {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    outline: none;
    transition: all 0.18s ease;
  }

  .cam-search:focus {
    border-color: #3f63ff;
    box-shadow: 0 0 0 2px rgba(63,99,255,0.15);
  }

  .cam-search::placeholder {
    color: var(--muted);
  }


  .cam-list {
    overflow-y: auto;
    max-height: calc(100vh - 260px);
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cam-list::-webkit-scrollbar { width: 4px; }
  .cam-list::-webkit-scrollbar-track { background: transparent; }
  .cam-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .cam-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    display: grid;
    grid-template-columns: 36px 1fr;
    grid-template-rows: auto auto;
    column-gap: 10px;
    align-items: center;
  }
  .cam-item:hover { background: rgba(49,87,255,0.18); border-color: #3f63ff; }
  .cam-item.active { background: rgba(49,87,255,0.25); border-color: #3f63ff; }

   .cam-item-switch {
    position: relative;
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    flex-shrink: 0;
    transition: all 0.18s ease;
  }

  .cam-item-switch::after {
    content: '';
    position: absolute;
    top: 1px;
    left: 1px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    transition: all 0.18s ease;
  }

  .cam-item.in-cycle .cam-item-switch {
    background: rgba(49,87,255,0.45);
    border-color: #4f72ff;
    box-shadow: 0 0 10px rgba(49,87,255,0.25);
  }

  .cam-item.in-cycle .cam-item-switch::after {
    left: 17px;
    background: #fff;
  }

  

  .cam-item-name {
    grid-column: 2;
    grid-row: 1;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.1;
    color: white;
  }
  .cam-item.active .cam-item-name {
    grid-column: 2;
    grid-row: 1;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.1;
    color: white;
  }
  .cam-item-sub {
    grid-column: 2;
    grid-row: 2;
    font-size: 11px;
    color: rgba(255,255,255,0.72);
    font-weight: 400;
    line-height: 1.2;
    margin-top: 2px;
  }

  /* ── Cycle Settings Panel ── */
  .cycle-panel {
    background: rgba(13,20,48,0.92);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 24px;
  }

  .cycle-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .panel-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--text);
  }

  .panel-title span { color: #3f63ff; }

  .cycle-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .time-input-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    width: 100%;
    justify-content: space-between;
  }

  .time-input-wrap label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .time-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    width: 100%;
    min-width: 140px;
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    outline: none;
  }
  .time-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(0,196,255,0.5);
  }

  .time-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: #3f63ff;
    min-width: 52px;
    text-align: center;
  }

  .cycle-queue-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .cycle-queue-label span { color: #3f63ff; font-weight: 600; }

  /* Quick-select venue buttons */
  .venue-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .venue-tag {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .venue-tag:hover { border-color: #3f63ff; color: #3f63ff; }
  .venue-tag.all-on { background: rgba(0,196,255,0.15); border-color: #3f63ff; color: #3f63ff; }

  /* Cam selection grid inside panel */
  .cam-select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 6px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .cam-select-grid::-webkit-scrollbar { width: 4px; }
  .cam-select-grid::-webkit-scrollbar-track { background: transparent; }
  .cam-select-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .cam-select-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .cam-select-item:hover { border-color: var(--muted); }
  .cam-select-item.selected {
    border-color: #3f63ff;
    background: rgba(0,196,255,0.08);
  }

  .cam-select-check {
    width: 18px; height: 18px; flex-shrink: 0;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    transition: all 0.15s;
  }
  .cam-select-item.selected .cam-select-check {
    background: var(--accent);
    border-color: #3f63ff;
    color: #000;
  }

  .cam-select-text { flex: 1; min-width: 0; }
  .cam-select-venue { font-size: 10px; color: var(--accent2); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .cam-select-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


  @media (max-width: 768px) {
    .cycle-controls {
      flex-direction: column;
      align-items: stretch;
    }

    .time-input-wrap {
      order: -1;
    }

    .btn {
      justify-content: center;
    }
  }


  /* ── Bottom grid ── */
  .cam-grid-section { margin-top: 8px; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .cam-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }

  .cam-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; flex-direction: column; gap: 3px;
    position: relative;
  }
  .cam-card:hover { border-color: #3f63ff; transform: translateY(-2px); }
  .cam-card.active { border-color: #3f63ff; background: rgba(0,196,255,0.07); }
  .cam-card.in-cycle::after {
    content: '✓';
    position: absolute;
    top: 6px; right: 8px;
    font-size: 10px;
    color: #3f63ff;
  }

  .cam-card-venue { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--accent2); }
  .cam-card-name { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .cam-card-ch { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* Cast overlay */
  #castOverlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; z-index: 20;
  }
  #castOverlay.visible { display: flex; }
  .cast-icon { font-size: 48px; }
  .cast-text { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: #3f63ff; }
  .cast-sub { font-size: 13px; color: var(--muted); }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(13,20,48,0.92);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    transition: transform 0.3s ease;
    z-index: 100;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  


  
  /* ── Lake Conditions ── */
  .lake-status {
    margin-top: 22px;
  }

  .lake-card.unified {
    background: linear-gradient(180deg, rgba(13,20,48,0.96), rgba(8,12,28,0.98));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.28);
    overflow: hidden;
    position: relative;
  }

  .lake-card.unified::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at top right, rgba(90,130,255,0.14), transparent 55%);
    pointer-events: none;
  }

  .lake-card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1.5px;
    color: #7aa2ff;
    margin-bottom: 16px;
  }

  .lake-stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(90px, 1fr));
    gap: 14px;
  }

  .lake-stat {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    backdrop-filter: blur(8px);
  }

  .lake-stat-label {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .lake-stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
    color: #ffffff;
  }

  
  @media (max-width: 700px) {
    .lake-stats {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .lake-stat:last-child {
      grid-column: span 2;
    }

    .lake-stat {
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .lake-stat-value {
      font-size: 22px;
    }
  }




  .trend-up {
    color: #6dff9d;
  }

  .trend-down {
    color: #ff8b8b;
  }

  .trend-flat {
    color: #b8c5ff;
  }


  .cam-search-container {
    position: relative;
  }

  .clear-search-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: var(--muted);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    transition: all 0.18s ease;
  }

  .clear-search-btn:hover {
    background: rgba(255,255,255,0.14);
    color: #fff;
  }


  .sidebar-header.panel-title,
  .lake-card-title.panel-title {
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--text);

<script>
// ─── Camera Data (verified from spydernetwork.com) ────────────────────────────
const CAMS = [
  { name: "Outside Pool", venue: "Alhonna", channel: "spydernetwork57", slug: "double-ds-roadhouse-gameroom" },
  { name: "Inside Pool", venue: "Alhonna", channel: "spydernetwork6", slug: "backwater-jacks-dock" },

  { name: "Dock", venue: "Bridgeview Marina", channel: "spydernetwork66", slug: "backwater-jacks-level-five-lake-ozarks" },
  { name: "Cam 1", venue: "Dock Glide", channel: "spydernetwork3", slug: "backwater-jacks-pool" },
  { name: "Pool", venue: "Dog Days", channel: "spydernetwork69", slug: "the-hatch" },

  { name: "Docs 2", venue: "Dog Days", channel: "spydernetwork44", slug: "marty-byrds-outside" },
  { name: "Pool 1", venue: "Encore Lakeside Grill", channel: "spydernetwork31", slug: "dog-days-pool" },
  { name: "Pool 2", venue: "Encore Lakeside Grill", channel: "spydernetwork32", slug: "dog-days-stage" },
  { name: "Stage", venue: "Encore Lakeside Grill", channel: "spydernetwork27", slug: "neon-taco-docks" },
  { name: "Stage", venue: "Fish & Co", channel: "spydernetwork9", slug: "encore-lakeside-grill-pool-bar-live-cam-top-bands-lake-of-the-ozarks" },
  { name: "Dock", venue: "Fish and Company", channel: "spydernetwork8", slug: "encore-lakeside-grill-pool-live-cam-top-bands-lake-of-the-ozarks" },
  { name: "Floor", venue: "Lake & Land Trading", channel: "spydernetwork10", slug: "encore-lakeside-grill-stage-live-cam-top-bands-lake-of-the-ozarks" },
  { name: "Dining", venue: "Lake Billiards", channel: "spydernetwork35", slug: "tucker-shuckers-north" },
  { name: "Pancam", venue: "Level Five", channel: "spydernetwork23", slug: "fish-and-company-dock-1" },
  { name: "Docks", venue: "MM17", channel: "spydernetwork56", slug: "double-ds-roadhouse" },
  { name: "Inside", venue: "Marty Byrde's", channel: "spydernetwork25", slug: "neon-taco-bar" },
  { name: "Street View", venue: "Marty Byrde's", channel: "spydernetwork24", slug: "fish-and-company" },
  { name: "Patio", venue: "Michael's Steak Chalet", channel: "spydernetwork38", slug: "wicked-willies-restaurant" },
  { name: "Deck", venue: "Neon Taco - Bar", channel: "spydernetwork34", slug: "dog-days-dock" },
  { name: "Docks 1", venue: "Paradise", channel: "spydernetwork20", slug: "bridgeview-marina" },
  { name: "Docks 2", venue: "Paradise", channel: "spydernetwork28", slug: "paradise-restaurant-bar" },
  { name: "Shoreland", venue: "Spyder on the Strip", channel: "spydernetwork45", slug: "marty-byrds" },
  { name: "Bridge", venue: "Topsider", channel: "spydernetwork29", slug: "paradise-restaurant-bar-2" },
  { name: "Top Deck", venue: "Tuckers", channel: "spydernetwork33", slug: "dog-days-dock-1" },
  { name: "Dining", venue: "Wicked Willie's", channel: "spydernetwork37", slug: "wicked-willies-bar" }
];

// ─── State ────────────────────────────────────────────────────────────────────
let currentIdx = 0;
let cycleQueue = [];       // indices of cams in cycle
let cycleQueuePos = 0;     // position within cycleQueue
let selectedCams = new Set(CAMS.map((_, i) => i)); // all selected by default
let timerTimeout = null;
let timerStart = null;
let isCycling = false;
let castSession = null;

function timerMs() {
  return parseInt(document.getElementById('timeSlider').value) * 1000;
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function init() {
  document.getElementById('camCount').textContent = CAMS.length + ' cams';
  buildSidebar();
  updateSelectedCount();
  loadCam(0);
  setupCastListeners();
  loadLakeConditions();
}

// ─── Load Cam ─────────────────────────────────────────────────────────────────
// Multiple Twitch parent domains are included so embeds work before DNS propagation.
function loadCam(idx) {
  currentIdx = ((idx % CAMS.length) + CAMS.length) % CAMS.length;
  const cam = CAMS[currentIdx];

  document.getElementById('camName').textContent = `${cam.venue} — ${cam.name}`;
  document.getElementById('camIndex').textContent = `${currentIdx + 1} / ${CAMS.length}`;

  const allowedParents = [
    'jeffrwinters.github.io',
    'cams.lakefrontatloto.com',
    'localhost',
    '127.0.0.1'
  ];

  const parentParams = allowedParents
    .map(p => `parent=${p}`)
    .join('&');

  const src = `https://player.twitch.tv/?channel=${cam.channel}&${parentParams}&autoplay=true&muted=false`;
  document.getElementById('twitchFrame').src = src;

  // Update sidebar
  document.querySelectorAll('.cam-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
    // removed automatic sidebar scroll behavior
  });

  if (castSession) castCam(cam);
  resetTimerBar();
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function nextCam() {
  if (isCycling && cycleQueue.length > 0) {
    cycleQueuePos = (cycleQueuePos + 1) % cycleQueue.length;
    loadCam(cycleQueue[cycleQueuePos]);
  } else {
    loadCam(currentIdx + 1);
  }
}

function prevCam() {
  if (isCycling && cycleQueue.length > 0) {
    cycleQueuePos = (cycleQueuePos - 1 + cycleQueue.length) % cycleQueue.length;
    loadCam(cycleQueue[cycleQueuePos]);
  } else {
    loadCam(currentIdx - 1);
  }
}

// ─── Auto Cycle ───────────────────────────────────────────────────────────────
function toggleCycle() {
  if (isCycling) stopCycle();
  else startCycle();
}

function startCycle() {
  cycleQueue = [...selectedCams].sort((a, b) => a - b);
  if (cycleQueue.length === 0) { showToast('Select at least one cam to cycle'); return; }
  // Find position of current cam in queue, or start from 0
  const pos = cycleQueue.indexOf(currentIdx);
  cycleQueuePos = pos >= 0 ? pos : 0;
  isCycling = true;
  document.getElementById('cycleBtn').classList.add('active');
  document.getElementById('cycleBtn').textContent = '⏸ Cycling';
  document.getElementById('cycleBtnPanel').classList.add('active');
  document.getElementById('cycleBtnPanel').textContent = '⏸ Stop Cycle';
  document.getElementById('cycleStatus').textContent = `Cycling ${cycleQueue.length} cams`;
  scheduleTick();
}

function stopCycle() {
  isCycling = false;
  clearTimeout(timerTimeout);
  timerTimeout = null;
  document.getElementById('cycleBtn').classList.remove('active');
  document.getElementById('cycleBtn').textContent = '▶ Auto-Cycle';
  document.getElementById('cycleBtnPanel').classList.remove('active');
  document.getElementById('cycleBtnPanel').textContent = '▶ Start Cycle';
  document.getElementById('cycleStatus').textContent = 'Off';
  document.getElementById('timerBar').style.width = '0%';
}

function scheduleTick() {
  clearTimeout(timerTimeout);
  timerStart = Date.now();
  animateTimer();
  timerTimeout = setTimeout(() => {
    if (!isCycling) return;
    cycleQueuePos = (cycleQueuePos + 1) % cycleQueue.length;
    loadCam(cycleQueue[cycleQueuePos]);
    scheduleTick();
  }, timerMs());
}

function resetTimerBar() {
  if (isCycling) { clearTimeout(timerTimeout); scheduleTick(); }
  else document.getElementById('timerBar').style.width = '0%';
}

function animateTimer() {
  if (!isCycling || !timerStart) return;
  const pct = Math.min(((Date.now() - timerStart) / timerMs()) * 100, 100);
  document.getElementById('timerBar').style.width = pct + '%';
  if (pct < 100) requestAnimationFrame(animateTimer);
}

// ─── Time slider ──────────────────────────────────────────────────────────────
function updateTimeDisplay() {
  const val = parseInt(document.getElementById('timeSlider').value);
  const disp = val < 60 ? val + 's' : (val / 60) % 1 === 0 ? (val / 60) + 'm' : (val / 60).toFixed(1) + 'm';
  document.getElementById('timeDisplay').textContent = disp;
  if (isCycling) { clearTimeout(timerTimeout); scheduleTick(); }
}

// ─── Cam Selection ────────────────────────────────────────────────────────────
function toggleCamSelection(idx) {
  if (selectedCams.has(idx)) selectedCams.delete(idx);
  else selectedCams.add(idx);
  updateSelectionUI(idx);
  updateSelectedCount();
}

function updateSelectionUI(idx) {
  const inCycle = selectedCams.has(idx);
  // sidebar
  const sideItem = document.querySelector(`.cam-item[data-idx="${idx}"]`);
  if (sideItem) {
    sideItem.classList.toggle('in-cycle', inCycle);

  }
}

function updateSelectedCount() {
  document.getElementById('selectedCount').textContent = selectedCams.size;
}

function selectAll() {
  CAMS.forEach((_, i) => selectedCams.add(i));
  CAMS.forEach((_, i) => updateSelectionUI(i));
  updateSelectedCount();
}

function selectNone() {
  selectedCams.clear();
  CAMS.forEach((_, i) => updateSelectionUI(i));
  updateSelectedCount();
}



// ─── Build UI ─────────────────────────────────────────────────────────────────
function buildSidebar() {
  const list = document.getElementById('camList');
  CAMS.forEach((cam, i) => {
    const el = document.createElement('div');
    el.className = 'cam-item in-cycle'; // all selected by default
    el.dataset.idx = i;
    el.innerHTML = `
      <div class="cam-item-switch"></div>
      
      <span class="cam-item-name">${cam.venue}</span><span class="cam-item-sub">${cam.name}</span>
    `;
    el.addEventListener('click', (e) => {
      // Right-click or long-press area toggles selection; left click loads cam
      loadCam(i);
    });
    el.querySelector('.cam-item-switch').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleCamSelection(i);
    });
    list.appendChild(el);
  });
}





// ─── Direct Link ──────────────────────────────────────────────────────────────
function openDirect() {
  window.open(`https://www.spydernetwork.com/${CAMS[currentIdx].slug}/`, '_blank');
}

// ─── Chromecast ───────────────────────────────────────────────────────────────
function setupCastListeners() {
  if (typeof cast === 'undefined' || !cast.framework) {
    console.log('Cast framework unavailable');
    return;
  }

  window['__onGCastApiAvailable'] = function(isAvailable) {
    if (!isAvailable) return;

    try {
      const ctx = cast.framework.CastContext.getInstance();

      ctx.setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
      });

      ctx.addEventListener(
        cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
        (e) => {
          const state = e.sessionState;

          if (
            state === cast.framework.SessionState.SESSION_STARTED ||
            state === cast.framework.SessionState.SESSION_RESUMED
          ) {
            castSession = ctx.getCurrentSession();

            const deviceName =
              castSession.getCastDevice().friendlyName;

            document.getElementById('castDeviceName').textContent =
              `Casting to: ${deviceName}`;

            document
              .getElementById('castOverlay')
              .classList.add('visible');

            document
              .getElementById('castBtn')
              .classList.add('casting');

            castCam(CAMS[currentIdx]);

            showToast(`🎬 Casting to ${deviceName}`);
          } else if (
            state === cast.framework.SessionState.SESSION_ENDED
          ) {
            castSession = null;

            document
              .getElementById('castOverlay')
              .classList.remove('visible');

            document
              .getElementById('castBtn')
              .classList.remove('casting');

            showToast('Casting stopped');
          }
        }
      );
    } catch (err) {
      console.error('Cast setup failed:', err);
    }
  };
}

function castCam(cam) {
  if (!castSession) return;
  const mediaInfo = new chrome.cast.media.MediaInfo(`https://www.twitch.tv/${cam.channel}`, 'video/mp4');
  mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
  mediaInfo.metadata.title = `${cam.venue} — ${cam.name}`;
  mediaInfo.metadata.subtitle = 'SpyderNetwork • Lake of the Ozarks LIVE';
  castSession.loadMedia(new chrome.cast.media.LoadRequest(mediaInfo)).catch(() => {
    showToast('Stream sent to TV');
  });
}

document.getElementById('castBtn').addEventListener('click', async () => {
  const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

  if (isMobile) {
    showToast('Use your browser or device screen-casting feature for best results while cycling cams');
    alert(
      'For the smoothest auto-cycle experience:\n\n' +
      '• Android: Use Chrome > Cast Screen\n' +
      '• iPhone/iPad: Use Screen Mirroring / AirPlay\n\n' +
      'This keeps camera cycling working continuously on your TV.'
    );
    return;
  }

  if (typeof cast !== 'undefined' && cast.framework) {
    showToast('Starting cast session...');
    cast.framework.CastContext.getInstance().requestSession();
  } else {
    alert(
      'Best experience:\n\n' +
      'Use Google Chrome desktop browser and use:\n' +
      'Menu > Cast > Cast Tab\n\n' +
      'This allows auto-cycle to continue on the TV.'
    );
  }
});

function stopCast() {
  if (castSession) castSession.endSession(true);
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}


// ─── Cam Search ───────────────────────────────────────────────────────────────
function filterCams() {
  const input = document.getElementById('camSearch');

  const val = input.value
    .toLowerCase()
    .trim();

  const clearBtn = document.getElementById('clearSearchBtn');

  clearBtn.style.display = val ? 'flex' : 'none';

  document.querySelectorAll('.cam-item').forEach((el, i) => {
    const cam = CAMS[i];

    const text =
      `${cam.venue} ${cam.name} ${cam.channel}`.toLowerCase();

    el.style.display = text.includes(val) ? 'flex' : 'none';
  });
}

function clearCamSearch() {
  const input = document.getElementById('camSearch');

  input.value = '';

  filterCams();

  input.focus();
}




// ─── Lake Conditions ─────────────────────────────────────────────────────────
async function loadLakeConditions() {
  try {
    const weatherUrl =
      'https://api.open-meteo.com/v1/forecast?latitude=38.1986&longitude=-92.6385&current=temperature_2m,wind_speed_10m&temperature_unit=fahrenheit&windspeed_unit=mph';

    const weatherRes = await fetch(weatherUrl);
    const weatherData = await weatherRes.json();

    const air = Math.round(weatherData.current.temperature_2m);
    const wind = Math.round(weatherData.current.wind_speed_10m);

    document.getElementById('airTemp').textContent = air + '°';
    document.getElementById('windSpeed').textContent = wind + ' mph';

    // seasonal estimate fallback
    const month = new Date().getMonth() + 1;

    let waterTemp = 55;

    if (month <= 3) waterTemp = 48;
    else if (month <= 4) waterTemp = 58;
    else if (month <= 5) waterTemp = 68;
    else if (month <= 6) waterTemp = 76;
    else if (month <= 8) waterTemp = 84;
    else if (month <= 9) waterTemp = 79;
    else if (month <= 10) waterTemp = 68;
    else waterTemp = 58;

    document.getElementById('waterTemp').textContent = waterTemp + '°';

    // stable defaults for GitHub Pages
    document.getElementById('lakeLevel').textContent = '659 ft';

    const discharge = 32;
    const trend = '↑';

    document.getElementById('discharge').innerHTML =
      '<span class="trend-up">' + trend + '</span> ' + discharge + 'k';

  } catch (err) {
    console.error('Lake conditions failed', err);

    document.getElementById('waterTemp').textContent = '72°';
    document.getElementById('airTemp').textContent = '78°';
    document.getElementById('windSpeed').textContent = '8 mph';
    document.getElementById('lakeLevel').textContent = '659 ft';
    document.getElementById('discharge').innerHTML =
      '<span class="trend-flat">→</span> 32k';
  }
}


// ─── Main Tabs ───────────────────────────────────────────────────────────────
function showMainTab(tab) {
  const camsPanel = document.getElementById('camsPanel');
  const mapPanel = document.getElementById('mapPanel');

  const camsBtn = document.getElementById('camsTabBtn');
  const mapBtn = document.getElementById('mapTabBtn');

  if (tab === 'map') {
    camsPanel.classList.remove('active');
    mapPanel.classList.add('active');

    camsBtn.classList.remove('active');
    mapBtn.classList.add('active');

    setTimeout(() => {
      if (window.lotoMap) {
        window.lotoMap.invalidateSize();
      }
    }, 120);

  } else {
    mapPanel.classList.remove('active');
    camsPanel.classList.add('active');

    mapBtn.classList.remove('active');
    camsBtn.classList.add('active');
  }
}


// ─── Keyboard Shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextCam(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); prevCam(); }
  if (e.key === ' ') { e.preventDefault(); toggleCycle(); }
});

try {
  init();
} catch (err) {
  console.error('App init failed:', err);
}

window.lotoMap = L.map('lakeMap', {
  zoomControl: false,
  attributionControl: false
}).setView([38.19, -92.72], 11);
const map = window.lotoMap;

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19
  }
).addTo(map);


L.control.zoom({
  position: 'bottomright'
}).addTo(map);

// My Location button
const LocateControl = L.Control.extend({
  options: {
    position: 'topright'
  },

  onAdd: function () {
    const container = L.DomUtil.create('button', 'locate-btn');

    container.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v3"></path>
        <path d="M12 19v3"></path>
        <path d="M2 12h3"></path>
        <path d="M19 12h3"></path>
      </svg>
    `;

    container.title = 'My Location';

    L.DomEvent.disableClickPropagation(container);

    container.onclick = () => {
      map.locate({
        setView: true,
        maxZoom: 14
      });
    };

    return container;
  }
});

map.addControl(new LocateControl());

map.on('locationfound', (e) => {
  if (window.userLocationMarker) {
    map.removeLayer(window.userLocationMarker);
  }

  window.userLocationMarker = L.circleMarker(e.latlng, {
    radius: 8,
    color: '#3f63ff',
    fillColor: '#8ea2ff',
    fillOpacity: 1,
    weight: 3
  }).addTo(map);

  window.userLocationMarker.bindPopup('You are here').openPopup();
});

map.on('locationerror', () => {
  alert('Unable to access your location.');
});

const restaurantLayer = L.layerGroup().addTo(map);
const marinaLayer = L.layerGroup().addTo(map);
const markerLayer = L.layerGroup().addTo(map);


async function loadLayer(data, layer, color, radius=7) {

  data.forEach(item => {
    const marker = L.circleMarker(
      [item.lat, item.lng],
      {
        radius,
        color,
        fillColor: color,
        fillOpacity: 0.9,
        weight: 2
      }
    );

    marker.bindPopup(`
      <div>
        <h3>${item.name}</h3>
        <p>${item.description || ''}</p>
      </div>
    `);

    marker.addTo(layer);
  });
}


async function loadMileMarkers() {
  const response = Promise.resolve({ json: async () => MILEMARKERS });
  const data = await response.json();

  data.forEach(item => {
    const label = L.marker(
      [item.lat, item.lng],
      {
        icon: L.divIcon({
          className: '',
          html: `<div style="
            color: rgba(30,30,30,0.82);
            font-size: 11px;
            font-weight: 700;
          ">${item.name}</div>`
        })
      }
    );

    label.addTo(markerLayer);
  });
}

loadLayer(RESTAURANTS, restaurantLayer, '#ff884d');
loadLayer(MARINAS, marinaLayer, '#4da3ff');
loadMileMarkers();

// Interactive restaurant list
const restaurantList = document.getElementById('restaurantList');

RESTAURANTS.forEach((item) => {
  const el = document.createElement('div');

  el.className = 'place-item';

  el.innerHTML = `
    <div class="place-name">${item.name}</div>
    <div class="place-desc">${item.description || ''}</div>
  `;

  el.onclick = () => {
    map.setView([item.lat, item.lng], 15, {
      animate: true
    });

    L.popup()
      .setLatLng([item.lat, item.lng])
      .setContent(`
        <div>
          <h3>${item.name}</h3>
          <p>${item.description || ''}</p>
        </div>
      `)
      .openOn(map);
  };

  restaurantList.appendChild(el);
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {

    document.querySelectorAll('.filter-btn')
      .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    const layer = btn.dataset.layer;

    restaurantLayer.remove();
    marinaLayer.remove();
    // marker layer always visible

    markerLayer.addTo(map);

    if (layer === 'all') {
      restaurantLayer.addTo(map);
      marinaLayer.addTo(map);
    }

    if (layer === 'food') {
      restaurantLayer.addTo(map);
    }

    if (layer === 'fuel') {
      marinaLayer.addTo(map);
    }

    
  });
});
