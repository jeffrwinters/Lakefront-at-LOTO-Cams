<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpyderNetwork — Lake of the Ozarks Live Cams</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #050a0f;
    --surface: #0b1520;
    --card: #0f1e2e;
    --border: #1a3048;
    --accent: #00c4ff;
    --accent2: #ff6b00;
    --text: #e8f4ff;
    --muted: #5a7a99;
    --live: #ff3b3b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle water-like background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0,100,180,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 80%, rgba(0,196,255,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(5,10,15,0.9);
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .logo-main {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,196,255,0.4);
  }

  .logo-sub {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Cast button */
  google-cast-launcher {
    --connected-color: var(--accent);
    --disconnected-color: var(--muted);
    width: 36px;
    height: 36px;
    cursor: pointer;
  }

  #castBtn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 40px;
    height: 40px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 18px;
  }
  #castBtn:hover { border-color: var(--accent); color: var(--accent); }
  #castBtn.casting { border-color: var(--accent); color: var(--accent); background: rgba(0,196,255,0.1); }

  main {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* Player */
  .player-section {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    margin-bottom: 24px;
  }

  @media (max-width: 900px) {
    .player-section { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }

  .player-wrap {
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  .player-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .cam-label {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .live-dot {
    width: 8px; height: 8px;
    background: var(--live);
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .cam-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1px;
    color: var(--text);
  }

  .cam-index {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
  }

  .player-actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: rgba(0,196,255,0.15); border-color: var(--accent); color: var(--accent); }
  .btn.accent { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  .btn.accent:hover { background: #00e0ff; }

  .player-frame {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
  }

  #twitchFrame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .player-footer {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }

  .nav-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .nav-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

  .auto-cycle-label {
    font-size: 11px;
    color: var(--muted);
  }

  /* Timer bar */
  .timer-bar-wrap {
    flex: 1;
    margin: 0 16px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  #timerBar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.5s linear;
    border-radius: 2px;
  }

  /* Sidebar */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-header {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--muted);
    padding: 0 4px 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  .cam-list {
    overflow-y: auto;
    max-height: calc(100vh - 260px);
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .cam-list::-webkit-scrollbar { width: 4px; }
  .cam-list::-webkit-scrollbar-track { background: transparent; }
  .cam-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .cam-item {
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cam-item:hover { background: var(--card); border-color: var(--border); }
  .cam-item.active {
    background: rgba(0,196,255,0.1);
    border-color: rgba(0,196,255,0.4);
  }

  .cam-item-num {
    font-size: 10px;
    color: var(--muted);
    width: 22px;
    text-align: right;
    flex-shrink: 0;
  }

  .cam-item-name {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.3;
    flex: 1;
  }

  .cam-item.active .cam-item-name {
    color: var(--accent);
  }

  /* Bottom cam grid (mobile / extra view) */
  .cam-grid-section {
    margin-top: 8px;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .cam-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }

  .cam-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cam-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .cam-card.active { border-color: var(--accent); background: rgba(0,196,255,0.07); }

  .cam-card-venue {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent2);
  }

  .cam-card-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }

  .cam-card-ch {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Cast overlay */
  #castOverlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    z-index: 20;
  }

  #castOverlay.visible { display: flex; }

  .cast-icon { font-size: 48px; }

  .cast-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .cast-sub {
    font-size: 13px;
    color: var(--muted);
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    transition: transform 0.3s ease;
    z-index: 100;
    pointer-events: none;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }

  /* Speed selector */
  select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-main">SpyderNetwork</span>
    <span class="logo-sub">Lake of the Ozarks · Live Cams</span>
  </div>
  <div class="header-controls">
    <button id="castBtn" title="Cast to TV">📺</button>
  </div>
</header>

<main>
  <div class="player-section">
    <div class="player-wrap">
      <div class="player-top-bar">
        <div class="cam-label">
          <div class="live-dot"></div>
          <span class="cam-name" id="camName">Loading...</span>
          <span class="cam-index" id="camIndex"></span>
        </div>
        <div class="player-actions">
          <select id="speedSelect" title="Auto-cycle interval">
            <option value="0">Manual</option>
            <option value="20000">20s</option>
            <option value="30000" selected>30s</option>
            <option value="60000">1m</option>
            <option value="120000">2m</option>
            <option value="300000">5m</option>
          </select>
          <button class="btn" id="cycleBtn" onclick="toggleCycle()">▶ Auto-Cycle</button>
          <button class="btn" onclick="openDirect()" title="Open on SpyderNetwork.com">↗ Site</button>
        </div>
      </div>
      <div class="player-frame">
        <iframe id="twitchFrame"
          allowfullscreen
          allow="autoplay; fullscreen; encrypted-media"
          sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-presentation">
        </iframe>
        <div id="castOverlay">
          <div class="cast-icon">📺</div>
          <div class="cast-text">Casting to TV</div>
          <div class="cast-sub" id="castDeviceName">Connected</div>
          <button class="btn accent" onclick="stopCast()">Stop Casting</button>
        </div>
      </div>
      <div class="player-footer">
        <div class="nav-controls">
          <button class="nav-btn" onclick="prevCam()" title="Previous">◀</button>
          <button class="nav-btn" onclick="nextCam()" title="Next">▶</button>
        </div>
        <div class="timer-bar-wrap">
          <div id="timerBar"></div>
        </div>
        <span class="auto-cycle-label" id="cycleStatus">Auto-cycle off</span>
      </div>
    </div>

    <!-- Sidebar cam list -->
    <div class="sidebar">
      <div class="sidebar-header">All Cams — <span id="camCount"></span></div>
      <div class="cam-list" id="camList"></div>
    </div>
  </div>

  <!-- Grid of all cams -->
  <div class="cam-grid-section">
    <div class="section-title">Browse All Cameras</div>
    <div class="cam-grid" id="camGrid"></div>
  </div>
</main>

<div id="toast"></div>

let currentIdx = 0;

let castSession = null;

// ─── Init ──────────────────────────────────────────────────────────────────────
function init() {
  document.getElementById('camCount').textContent = CAMS.length + ' cams';
  buildSidebar();
  buildGrid();

// ─── Load Cam ──────────────────────────────────────────────────────────────────
function loadCam(idx) {
  currentIdx = ((idx % CAMS.length) + CAMS.length) % CAMS.length;
  const cam = CAMS[currentIdx];

  document.getElementById('camName').textContent = `${cam.venue} — ${cam.name}`;
  document.getElementById('camIndex').textContent = `${currentIdx + 1} / ${CAMS.length}`;

  // Detect the actual host so Twitch parent= always matches
  const host = window.location.hostname || 'htmlpreview.github.io';
  const src = `https://player.twitch.tv/?channel=${cam.channel}&parent=${host}&parent=spydernetwork.com&autoplay=true&muted=false`;
  document.getElementById('twitchFrame').src = src;

  // Update sidebar
  document.querySelectorAll('.cam-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
    if (i === currentIdx) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });

  // Update grid
  document.querySelectorAll('.cam-card').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
  });

  // If casting, tell the receiver
  if (castSession) {
    castCam(cam);
  }

  resetTimerBar();
}

// ─── Navigation ────────────────────────────────────────────────────────────────
function nextCam() { loadCam(currentIdx + 1); }
function prevCam() { loadCam(currentIdx - 1); }

// ─── Auto Cycle ────────────────────────────────────────────────────────────────
function toggleCycle() {
  if (isCycling) stopCycle();
  else startCycle();
}

function startCycle() {
  const sel = document.getElementById('speedSelect');
  const ms = parseInt(sel.value);
  if (!ms) { showToast('Select an interval first'); return; }
  timerDuration = ms;
  isCycling = true;
  document.getElementById('cycleBtn').classList.add('active');
  document.getElementById('cycleBtn').textContent = '⏸ Auto-Cycle';
  document.getElementById('cycleStatus').textContent = `Cycling every ${formatMs(ms)}`;
  scheduleTick();
}

function stopCycle() {
  isCycling = false;
  clearTimeout(timerTimeout);
  timerTimeout = null;
  document.getElementById('cycleBtn').classList.remove('active');
  document.getElementById('cycleBtn').textContent = '▶ Auto-Cycle';
  document.getElementById('cycleStatus').textContent = 'Auto-cycle off';
  document.getElementById('timerBar').style.width = '0%';
}

function scheduleTick() {
  clearTimeout(timerTimeout);
  timerStart = Date.now();
  animateTimer();
  timerTimeout = setTimeout(() => {
    nextCam();
    if (isCycling) scheduleTick();
  }, timerDuration);
}

function resetTimerBar() {
  if (isCycling) {
    clearTimeout(timerTimeout);
    scheduleTick();
  } else {
    document.getElementById('timerBar').style.width = '0%';
  }
}

function animateTimer() {
  if (!isCycling || !timerStart) return;
  const elapsed = Date.now() - timerStart;
  const pct = Math.min((elapsed / timerDuration) * 100, 100);
  document.getElementById('timerBar').style.width = pct + '%';
  if (pct < 100) requestAnimationFrame(animateTimer);
}

document.getElementById('speedSelect').addEventListener('change', () => {
  if (isCycling) {
    stopCycle();
    startCycle();
  }
});

function formatMs(ms) {
  if (ms < 60000) return (ms / 1000) + 's';
  return (ms / 60000) + 'm';
}

// ─── Build UI ──────────────────────────────────────────────────────────────────
function buildSidebar() {
  const list = document.getElementById('camList');
  CAMS.forEach((cam, i) => {
    const el = document.createElement('div');
    el.className = 'cam-item';
    el.innerHTML = `
      <span class="cam-item-num">${i + 1}</span>
      <span class="cam-item-name">${cam.venue}<br><span style="color:var(--muted);font-weight:300">${cam.name}</span></span>
    `;
    el.onclick = () => loadCam(i);
    list.appendChild(el);
  });
}

function buildGrid() {
  const grid = document.getElementById('camGrid');
  CAMS.forEach((cam, i) => {
    const el = document.createElement('div');
    el.className = 'cam-card';
    el.innerHTML = `
      <div class="cam-card-venue">${cam.venue}</div>
      <div class="cam-card-name">${cam.name}</div>
      <div class="cam-card-ch">${cam.channel}</div>
    `;
    el.onclick = () => { loadCam(i); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    grid.appendChild(el);
  });
}

// ─── Open Direct Link ──────────────────────────────────────────────────────────
function openDirect() {
  const cam = CAMS[currentIdx];
  window.open(`https://www.spydernetwork.com/${cam.slug}/`, '_blank');
}

// ─── Chromecast ────────────────────────────────────────────────────────────────
const CAST_APP_ID = chrome && chrome.cast ? chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID : null;

function setupCastListeners() {
  window['__onGCastApiAvailable'] = function(isAvailable) {
    if (!isAvailable) return;
    const ctx = cast.framework.CastContext.getInstance();
    ctx.setOptions({
      receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
      autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
    });

    ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, (e) => {
      const state = e.sessionState;
      if (state === cast.framework.SessionState.SESSION_STARTED ||
          state === cast.framework.SessionState.SESSION_RESUMED) {
        castSession = ctx.getCurrentSession();
        const deviceName = castSession.getCastDevice().friendlyName;
        document.getElementById('castDeviceName').textContent = `Casting to: ${deviceName}`;
        document.getElementById('castOverlay').classList.add('visible');
        document.getElementById('castBtn').classList.add('casting');
        castCam(CAMS[currentIdx]);
        showToast(`🎬 Casting to ${deviceName}`);
      } else if (state === cast.framework.SessionState.SESSION_ENDED) {
        castSession = null;
        document.getElementById('castOverlay').classList.remove('visible');
        document.getElementById('castBtn').classList.remove('casting');
        showToast('Casting stopped');
      }
    });
  };
}

function castCam(cam) {
  if (!castSession) return;
  const twitchUrl = `https://www.twitch.tv/${cam.channel}`;
  const mediaInfo = new chrome.cast.media.MediaInfo(twitchUrl, 'video/mp4');
  mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
  mediaInfo.metadata.title = `${cam.venue} — ${cam.name}`;
  mediaInfo.metadata.subtitle = 'SpyderNetwork • Lake of the Ozarks LIVE';
  const req = new chrome.cast.media.LoadRequest(mediaInfo);
  castSession.loadMedia(req).catch(() => {
    // Fallback: try to cast the SpyderNetwork page
    showToast('Stream cast started — check your TV');
  });
}

document.getElementById('castBtn').addEventListener('click', () => {
  if (typeof cast !== 'undefined' && cast.framework) {
    cast.framework.CastContext.getInstance().requestSession();
  } else {
    showToast('⚠️ Cast SDK not available — open in Chrome on a desktop');
  }
});

function stopCast() {
  if (castSession) castSession.endSession(true);
}

// ─── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── Keyboard Shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextCam(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevCam(); }
  if (e.key === ' ') { e.preventDefault(); toggleCycle(); }
});

// ─── Start ─────────────────────────────────────────────────────────────────────
init();
</script>
