<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakefront at LOTO Cams</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<style>
  :root {
    --bg: #02050a;
    --surface: #0d1430;
    --card: #14204a;
    --border: #2f47a1;

    --accent: #3157ff;
    --accent2: #8ea2ff;

    --text: #f4f7ff;
    --muted: #b3c0ff;
    --live: #ff4d4d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0,100,180,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 80%, rgba(0,196,255,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,12,28,0.96);
    backdrop-filter: blur(12px);
  }

  .logo { display: flex; align-items: center; gap: 10px; }

  .logo-main {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #3f63ff;
    -webkit-text-stroke: 0.5px rgba(255,255,255,0.7);
    text-shadow:
      0 0 10px rgba(0,196,255,0.15),
      0 0 2px rgba(255,255,255,0.12);
  }

  .logo-sub {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .header-controls { display: flex; align-items: center; gap: 12px; }

  #castBtn {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
    font-size: 15px;
    font-weight: 700;
    min-height: 44px;
  }

  #castBtn svg {
    flex-shrink: 0;
  }
  #castBtn:hover { border-color: #3f63ff; color: #3f63ff; }
  #castBtn.casting { border-color: #3f63ff; color: #3f63ff; background: rgba(0,196,255,0.1); }

  main {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  .player-section {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    margin-bottom: 24px;
  }

  @media (max-width: 900px) {
    .player-section {
      grid-template-columns: 1fr;
    }

    .sidebar {
      display: flex;
      margin-top: 12px;
      max-height: 260px;
      overflow: hidden;
      background: rgba(13,20,48,0.92);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .cam-list {
      max-height: 220px;
      width: 100%;
    }
  }

  .player-wrap {
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  .player-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(13,20,48,0.92);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }

  .cam-label { display: flex; align-items: center; gap: 10px; min-width: 0; }

  .live-dot {
    width: 8px; height: 8px; flex-shrink: 0;
    background: var(--live);
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .cam-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 1px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cam-index { font-size: 11px; color: var(--muted); font-weight: 300; flex-shrink: 0; }

  .player-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: #3f63ff; color: #3f63ff; }
  .btn.active { background: rgba(0,196,255,0.15); border-color: #3f63ff; color: #3f63ff; }
  .btn.accent { background: var(--accent); color: #000; border-color: #3f63ff; font-weight: 700; }
  .btn.accent:hover { background: #00e0ff; }
  .btn.danger { background: rgba(255,59,59,0.15); border-color: rgba(255,59,59,0.5); color: #ff6b6b; }

  .player-frame {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
  }

  #twitchFrame {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border: none;
  }

  .player-footer {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(13,20,48,0.92);
    border-top: 1px solid var(--border);
    gap: 10px;
  }

  .nav-controls { display: flex; gap: 8px; align-items: center; }

  .nav-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: #3f63ff; color: #3f63ff; }

  .timer-bar-wrap {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  #timerBar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    border-radius: 2px;
  }

  .auto-cycle-label { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ── Sidebar ── */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: rgba(13,20,48,0.7);
    border-radius: 14px;
    padding: 10px;
    border: 1px solid var(--border);
  }

  .sidebar-header {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--muted);
    padding: 0 4px 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  .cam-list {
    overflow-y: auto;
    max-height: calc(100vh - 260px);
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cam-list::-webkit-scrollbar { width: 4px; }
  .cam-list::-webkit-scrollbar-track { background: transparent; }
  .cam-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .cam-item {
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cam-item:hover { background: rgba(49,87,255,0.18); border-color: #3f63ff; }
  .cam-item.active { background: rgba(49,87,255,0.25); border-color: #3f63ff; }

   .cam-item-switch {
    position: relative;
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    flex-shrink: 0;
    transition: all 0.18s ease;
  }

  .cam-item-switch::after {
    content: '';
    position: absolute;
    top: 1px;
    left: 1px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    transition: all 0.18s ease;
  }

  .cam-item.in-cycle .cam-item-switch {
    background: rgba(49,87,255,0.45);
    border-color: #4f72ff;
    box-shadow: 0 0 10px rgba(49,87,255,0.25);
  }

  .cam-item.in-cycle .cam-item-switch::after {
    left: 17px;
    background: #fff;
  }

  .cam-item-num { font-size: 10px; color: var(--muted); width: 18px; text-align: right; flex-shrink: 0; }

  .cam-item-name { font-size: 12px; font-weight: 500; line-height: 1.3; flex: 1; }
  .cam-item.active .cam-item-name { color: #3f63ff; }
  .cam-item-sub { font-size: 10px; color: var(--muted); font-weight: 300; }

  /* ── Cycle Settings Panel ── */
  .cycle-panel {
    background: rgba(13,20,48,0.92);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 24px;
  }

  .cycle-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .panel-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--text);
  }

  .panel-title span { color: #3f63ff; }

  .cycle-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .time-input-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    width: 100%;
    justify-content: space-between;
  }

  .time-input-wrap label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .time-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    width: 100%;
    min-width: 140px;
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    outline: none;
  }
  .time-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(0,196,255,0.5);
  }

  .time-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: #3f63ff;
    min-width: 52px;
    text-align: center;
  }

  .cycle-queue-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .cycle-queue-label span { color: #3f63ff; font-weight: 600; }

  /* Quick-select venue buttons */
  .venue-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .venue-tag {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .venue-tag:hover { border-color: #3f63ff; color: #3f63ff; }
  .venue-tag.all-on { background: rgba(0,196,255,0.15); border-color: #3f63ff; color: #3f63ff; }

  /* Cam selection grid inside panel */
  .cam-select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 6px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .cam-select-grid::-webkit-scrollbar { width: 4px; }
  .cam-select-grid::-webkit-scrollbar-track { background: transparent; }
  .cam-select-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .cam-select-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .cam-select-item:hover { border-color: var(--muted); }
  .cam-select-item.selected {
    border-color: #3f63ff;
    background: rgba(0,196,255,0.08);
  }

  .cam-select-check {
    width: 18px; height: 18px; flex-shrink: 0;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    transition: all 0.15s;
  }
  .cam-select-item.selected .cam-select-check {
    background: var(--accent);
    border-color: #3f63ff;
    color: #000;
  }

  .cam-select-text { flex: 1; min-width: 0; }
  .cam-select-venue { font-size: 10px; color: var(--accent2); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .cam-select-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


  @media (max-width: 768px) {
    .cycle-controls {
      flex-direction: column;
      align-items: stretch;
    }

    .time-input-wrap {
      order: -1;
    }

    .btn {
      justify-content: center;
    }
  }


  /* ── Bottom grid ── */
  .cam-grid-section { margin-top: 8px; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .cam-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }

  .cam-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; flex-direction: column; gap: 3px;
    position: relative;
  }
  .cam-card:hover { border-color: #3f63ff; transform: translateY(-2px); }
  .cam-card.active { border-color: #3f63ff; background: rgba(0,196,255,0.07); }
  .cam-card.in-cycle::after {
    content: '✓';
    position: absolute;
    top: 6px; right: 8px;
    font-size: 10px;
    color: #3f63ff;
  }

  .cam-card-venue { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--accent2); }
  .cam-card-name { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .cam-card-ch { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* Cast overlay */
  #castOverlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; z-index: 20;
  }
  #castOverlay.visible { display: flex; }
  .cast-icon { font-size: 48px; }
  .cast-text { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: #3f63ff; }
  .cast-sub { font-size: 13px; color: var(--muted); }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(13,20,48,0.92);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    transition: transform 0.3s ease;
    z-index: 100;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

<header>
  <div class="logo">
    <span class="logo-main">Lakefront at LOTO Cams</span>
    
  </div>
  <div class="header-controls">
    <button id="castBtn" title="Cast Auto-Cycle to TV">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <path d="M2 18.5C3.93 18.5 5.5 20.07 5.5 22H2V18.5Z" fill="currentColor"/>
  <path d="M2 14C6.42 14 10 17.58 10 22H7C7 19.24 4.76 17 2 17V14Z" fill="currentColor"/>
  <path d="M2 9.5C9.18 9.5 15 15.32 15 22H12C12 16.98 7.93 12.9 2.9 12.9H2V9.5Z" fill="currentColor"/>
  <path d="M21 3H3C1.9 3 1 3.9 1 5V8H3V5H21V19H14V21H21C22.1 21 23 20.1 23 19V5C23 3.9 22.1 3 21 3Z" fill="currentColor"/>

<span>Cast</span>
</button>
  </div>
</header>

<main>
  <!-- Player + sidebar -->
  <div class="player-section">
    <div class="player-wrap">
      <div class="player-top-bar">
        <div class="cam-label">
          <div class="live-dot"></div>
          <span class="cam-name" id="camName">Loading...</span>
          <span class="cam-index" id="camIndex"></span>
        </div>
        <div class="player-actions">
          <button class="btn" id="cycleBtn" onclick="toggleCycle()">▶ Auto-Cycle</button>
          <button class="btn" onclick="openDirect()">↗ Site</button>
        </div>
      </div>
      <div class="player-frame">
        <iframe id="twitchFrame"
          allowfullscreen
          allow="autoplay; fullscreen; encrypted-media"
          sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-presentation">
        </iframe>
        <div id="castOverlay">
          <div class="cast-icon">📺</div>
          <div class="cast-text">Casting to TV</div>
          <div class="cast-sub" id="castDeviceName">Connected</div>
          <button class="btn accent" onclick="stopCast()">Stop Casting</button>
        </div>
      </div>
      <div class="player-footer">
        <div class="nav-controls">
          <button class="nav-btn" onclick="prevCam()" title="Previous">◀</button>
          <button class="nav-btn" onclick="nextCam()" title="Next">▶</button>
        </div>
        <div class="timer-bar-wrap"><div id="timerBar"></div></div>
        <span class="auto-cycle-label" id="cycleStatus">Off</span>
      </div>
    </div>

    </div>
  </div>

  <!-- Cycle Settings Panel -->
  <div class="cycle-panel">
    <div class="cycle-panel-header">
      <div class="panel-title">Cycle Settings — <span id="selectedCount">0</span> cams selected</div>
      <div class="cycle-controls">
        <!-- Timer slider -->
        <div class="time-input-wrap">
          <label>Interval</label>
          <input type="range" class="time-slider" id="timeSlider" min="5" max="300" value="30" step="5" oninput="updateTimeDisplay()">
          <span class="time-display" id="timeDisplay">30s</span>
        </div>
        <button class="btn" id="cycleBtnPanel" onclick="toggleCycle()">▶ Start Cycle</button>
        <button class="btn" onclick="selectAll()">☑ All</button>
        <button class="btn" onclick="selectNone()">☐ None</button>
      </div>
    </div>

    <!-- Venue quick-filter tags -->
    <div class="venue-filters" id="venueFilters"></div>

    <!-- Cam selection grid -->
    <div class="cam-select-grid" id="camSelectGrid"></div>
  </div>

  </main>

<div id="toast"></div>

// ─── State ────────────────────────────────────────────────────────────────────
let currentIdx = 0;
let cycleQueue = [];       // indices of cams in cycle
let cycleQueuePos = 0;     // position within cycleQueue
let selectedCams = new Set(CAMS.map((_, i) => i)); // all selected by default
let timerTimeout = null;
let timerStart = null;
let isCycling = false;
let castSession = null;

function timerMs() {
  return parseInt(document.getElementById('timeSlider').value) * 1000;
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function init() {
  document.getElementById('camCount').textContent = CAMS.length + ' cams';
  buildCyclePanel();
  updateSelectedCount();
  loadCam(0);
  setupCastListeners();
}

// ─── Load Cam ─────────────────────────────────────────────────────────────────
function loadCam(idx) {
  currentIdx = ((idx % CAMS.length) + CAMS.length) % CAMS.length;
  const cam = CAMS[currentIdx];

  document.getElementById('camName').textContent = `${cam.venue} — ${cam.name}`;
  document.getElementById('camIndex').textContent = `${currentIdx + 1} / ${CAMS.length}`;

  const src = `https://player.twitch.tv/?channel=${cam.channel}&parent=jeffrwinters.github.io&autoplay=true&muted=false`;
  document.getElementById('twitchFrame').src = src;

  // Update sidebar
  document.querySelectorAll('.cam-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
    // removed automatic sidebar scroll behavior
  });

  // Update grid
  document.querySelectorAll('.cam-card').forEach((el, i) => el.classList.toggle('active', i === currentIdx));

  if (castSession) castCam(cam);
  resetTimerBar();
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function nextCam() {
  if (isCycling && cycleQueue.length > 0) {
    cycleQueuePos = (cycleQueuePos + 1) % cycleQueue.length;
    loadCam(cycleQueue[cycleQueuePos]);
  } else {
    loadCam(currentIdx + 1);
  }
}

function prevCam() {
  if (isCycling && cycleQueue.length > 0) {
    cycleQueuePos = (cycleQueuePos - 1 + cycleQueue.length) % cycleQueue.length;
    loadCam(cycleQueue[cycleQueuePos]);
  } else {
    loadCam(currentIdx - 1);
  }
}

// ─── Auto Cycle ───────────────────────────────────────────────────────────────
function toggleCycle() {
  if (isCycling) stopCycle();
  else startCycle();
}

function startCycle() {
  cycleQueue = [...selectedCams].sort((a, b) => a - b);
  if (cycleQueue.length === 0) { showToast('Select at least one cam to cycle'); return; }
  // Find position of current cam in queue, or start from 0
  const pos = cycleQueue.indexOf(currentIdx);
  cycleQueuePos = pos >= 0 ? pos : 0;
  isCycling = true;
  document.getElementById('cycleBtn').classList.add('active');
  document.getElementById('cycleBtn').textContent = '⏸ Cycling';
  document.getElementById('cycleBtnPanel').classList.add('active');
  document.getElementById('cycleBtnPanel').textContent = '⏸ Stop Cycle';
  document.getElementById('cycleStatus').textContent = `Cycling ${cycleQueue.length} cams`;
  scheduleTick();
}

function stopCycle() {
  isCycling = false;
  clearTimeout(timerTimeout);
  timerTimeout = null;
  document.getElementById('cycleBtn').classList.remove('active');
  document.getElementById('cycleBtn').textContent = '▶ Auto-Cycle';
  document.getElementById('cycleBtnPanel').classList.remove('active');
  document.getElementById('cycleBtnPanel').textContent = '▶ Start Cycle';
  document.getElementById('cycleStatus').textContent = 'Off';
  document.getElementById('timerBar').style.width = '0%';
}

function scheduleTick() {
  clearTimeout(timerTimeout);
  timerStart = Date.now();
  animateTimer();
  timerTimeout = setTimeout(() => {
    if (!isCycling) return;
    cycleQueuePos = (cycleQueuePos + 1) % cycleQueue.length;
    loadCam(cycleQueue[cycleQueuePos]);
    scheduleTick();
  }, timerMs());
}

function resetTimerBar() {
  if (isCycling) { clearTimeout(timerTimeout); scheduleTick(); }
  else document.getElementById('timerBar').style.width = '0%';
}

function animateTimer() {
  if (!isCycling || !timerStart) return;
  const pct = Math.min(((Date.now() - timerStart) / timerMs()) * 100, 100);
  document.getElementById('timerBar').style.width = pct + '%';
  if (pct < 100) requestAnimationFrame(animateTimer);
}

// ─── Time slider ──────────────────────────────────────────────────────────────
function updateTimeDisplay() {
  const val = parseInt(document.getElementById('timeSlider').value);
  const disp = val < 60 ? val + 's' : (val / 60) % 1 === 0 ? (val / 60) + 'm' : (val / 60).toFixed(1) + 'm';
  document.getElementById('timeDisplay').textContent = disp;
  if (isCycling) { clearTimeout(timerTimeout); scheduleTick(); }
}

// ─── Cam Selection ────────────────────────────────────────────────────────────
function toggleCamSelection(idx) {
  if (selectedCams.has(idx)) selectedCams.delete(idx);
  else selectedCams.add(idx);
  updateSelectionUI(idx);
  updateSelectedCount();
}

function updateSelectionUI(idx) {
  const inCycle = selectedCams.has(idx);
  // panel grid
  const panelItem = document.querySelector(`.cam-select-item[data-idx="${idx}"]`);
  if (panelItem) {
    panelItem.classList.toggle('selected', inCycle);
    panelItem.querySelector('.cam-select-check').textContent = inCycle ? '✓' : '';
  }
  // sidebar
  const sideItem = document.querySelector(`.cam-item[data-idx="${idx}"]`);
  if (sideItem) {
    sideItem.classList.toggle('in-cycle', inCycle);

  }
  // grid card
  const card = document.querySelector(`.cam-card[data-idx="${idx}"]`);
  if (card) card.classList.toggle('in-cycle', inCycle);
}

function updateSelectedCount() {
  document.getElementById('selectedCount').textContent = selectedCams.size;
}

function selectAll() {
  CAMS.forEach((_, i) => selectedCams.add(i));
  CAMS.forEach((_, i) => updateSelectionUI(i));
  updateSelectedCount();
}

function selectNone() {
  selectedCams.clear();
  CAMS.forEach((_, i) => updateSelectionUI(i));
  updateSelectedCount();
}

function selectVenue(venue) {
  CAMS.forEach((cam, i) => {
    if (cam.venue === venue) selectedCams.add(i);
    else selectedCams.delete(i);
  });
  CAMS.forEach((_, i) => updateSelectionUI(i));
  updateSelectedCount();
}

// ─── Build UI ─────────────────────────────────────────────────────────────────
function buildSidebar() {}

function buildGrid() {}

function buildCyclePanel() {
  // Venue filter tags
  const venues = [...new Set(CAMS.map(c => c.venue))];
  const filterDiv = document.getElementById('venueFilters');

  // "All" tag
  const allTag = document.createElement('div');
  allTag.className = 'venue-tag all-on';
  allTag.textContent = '☑ All';
  allTag.onclick = selectAll;
  filterDiv.appendChild(allTag);

  // "None" tag
  const noneTag = document.createElement('div');
  noneTag.className = 'venue-tag';
  noneTag.textContent = '☐ None';
  noneTag.onclick = selectNone;
  filterDiv.appendChild(noneTag);

  venues.forEach(venue => {
    const tag = document.createElement('div');
    tag.className = 'venue-tag';
    tag.textContent = venue;
    tag.onclick = () => selectVenue(venue);
    filterDiv.appendChild(tag);
  });

  // Cam selection grid
  const grid = document.getElementById('camSelectGrid');
  CAMS.forEach((cam, i) => {
    const el = document.createElement('div');
    el.className = 'cam-select-item selected';
    el.dataset.idx = i;
    el.innerHTML = `
      <div class="cam-select-check">✓</div>
      <div class="cam-select-text">
        <div class="cam-select-venue">${cam.venue}</div>
        <div class="cam-select-name">${cam.name}</div>
      </div>
    `;
    el.onclick = () => toggleCamSelection(i);
    grid.appendChild(el);
  });
}

// ─── Direct Link ──────────────────────────────────────────────────────────────
function openDirect() {
  window.open(`https://www.spydernetwork.com/${CAMS[currentIdx].slug}/`, '_blank');
}

// ─── Chromecast ───────────────────────────────────────────────────────────────
function setupCastListeners() {
  if (typeof cast === 'undefined' || !cast.framework) {
    console.log('Cast framework unavailable');
    return;
  }

  window['__onGCastApiAvailable'] = function(isAvailable) {
    if (!isAvailable) return;

    try {
      const ctx = cast.framework.CastContext.getInstance();

      ctx.setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
      });

      ctx.addEventListener(
        cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
        (e) => {
          const state = e.sessionState;

          if (
            state === cast.framework.SessionState.SESSION_STARTED ||
            state === cast.framework.SessionState.SESSION_RESUMED
          ) {
            castSession = ctx.getCurrentSession();

            const deviceName =
              castSession.getCastDevice().friendlyName;

            document.getElementById('castDeviceName').textContent =
              `Casting to: ${deviceName}`;

            document
              .getElementById('castOverlay')
              .classList.add('visible');

            document
              .getElementById('castBtn')
              .classList.add('casting');

            castCam(CAMS[currentIdx]);

            showToast(`🎬 Casting to ${deviceName}`);
          } else if (
            state === cast.framework.SessionState.SESSION_ENDED
          ) {
            castSession = null;

            document
              .getElementById('castOverlay')
              .classList.remove('visible');

            document
              .getElementById('castBtn')
              .classList.remove('casting');

            showToast('Casting stopped');
          }
        }
      );
    } catch (err) {
      console.error('Cast setup failed:', err);
    }
  };
}

function castCam(cam) {
  if (!castSession) return;
  const mediaInfo = new chrome.cast.media.MediaInfo(`https://www.twitch.tv/${cam.channel}`, 'video/mp4');
  mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
  mediaInfo.metadata.title = `${cam.venue} — ${cam.name}`;
  mediaInfo.metadata.subtitle = 'SpyderNetwork • Lake of the Ozarks LIVE';
  castSession.loadMedia(new chrome.cast.media.LoadRequest(mediaInfo)).catch(() => {
    showToast('Stream sent to TV');
  });
}

document.getElementById('castBtn').addEventListener('click', async () => {
  const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

  if (isMobile) {
    showToast('Use your browser or device screen-casting feature for best results while cycling cams');
    alert(
      'For the smoothest auto-cycle experience:\n\n' +
      '• Android: Use Chrome > Cast Screen\n' +
      '• iPhone/iPad: Use Screen Mirroring / AirPlay\n\n' +
      'This keeps camera cycling working continuously on your TV.'
    );
    return;
  }

  if (typeof cast !== 'undefined' && cast.framework) {
    showToast('Starting cast session...');
    cast.framework.CastContext.getInstance().requestSession();
  } else {
    alert(
      'Best experience:\n\n' +
      'Use Google Chrome desktop browser and use:\n' +
      'Menu > Cast > Cast Tab\n\n' +
      'This allows auto-cycle to continue on the TV.'
    );
  }
});

function stopCast() {
  if (castSession) castSession.endSession(true);
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── Keyboard Shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextCam(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); prevCam(); }
  if (e.key === ' ') { e.preventDefault(); toggleCycle(); }
});

try {
  init();
} catch (err) {
  console.error('App init failed:', err);
}
