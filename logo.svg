<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AB8FF"/>
      <stop offset="45%" stop-color="#3F63FF"/>
      <stop offset="100%" stop-color="#00C4FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text
    x="20"
    y="120"
    font-family="Arial, Helvetica, sans-serif"
    font-size="78"
    font-weight="800"
    letter-spacing="2"
    fill="url(#blueGlow)"
    stroke="rgba(255,255,255,0.75)"
    stroke-width="0.8"
    filter="url(#glow)"
  >
    LAKEFRONT
  </text>

  <text
    x="20"
    y="205"
    font-family="Arial, Helvetica, sans-serif"
    font-size="74"
    font-weight="800"
    letter-spacing="2"
    fill="url(#blueGlow)"
    stroke="rgba(255,255,255,0.75)"
    stroke-width="0.8"
    filter="url(#glow)"
  >
    AT LOTO CAMS
  </text>
</svg>
